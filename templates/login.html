{% extends "base.html" %}
{% block title %}Log in · AI Job Hunter{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h2 style="margin-top:0">Log in</h2>
  {% if error %}<p style="color:var(--bad)">Invalid API key.</p>{% endif %}
  <form method="post" action="/login">
    <p><label>API key<br><input type="password" name="api_key" required autocomplete="current-password" style="width:100%"></label></p>
    <button type="submit">Log in</button>
  </form>
  <p class="muted small">Use the <code>API_KEY</code> value from your server's environment.</p>
</div>
{% endblock %}
