<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Job Hunter{% endblock %}</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#2f6fed;
            --good:#12805c; --warn:#b54708; --bad:#b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111318; --card:#1a1d24; --text:#e6e8ec; --muted:#98a2b3; --line:#2b2f38; --accent:#6c9cff;
              --good:#47cd89; --warn:#fdb022; --bad:#f97066; }
    }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
    header { background:var(--card); border-bottom:1px solid var(--line); }
    .bar { max-width:1150px; margin:0 auto; padding:12px 16px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
    .bar strong { margin-right:auto; }
    main { max-width:1150px; margin:0 auto; padding:20px 16px 60px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
    .muted { color:var(--muted); } .small { font-size:13px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
    input, select, textarea, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line);
      border-radius:7px; padding:7px 9px; max-width:100%; }
    textarea { width:100%; }
    button, .btn { background:var(--accent); color:#fff; border:none; cursor:pointer; padding:7px 13px; border-radius:7px; display:inline-block; }
    button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
    table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
    .score { font-weight:700; border-radius:6px; padding:2px 8px; display:inline-block; min-width:42px; text-align:center; }
    .s-excellent, .s-strong { background:color-mix(in srgb,var(--good) 18%,transparent); color:var(--good); }
    .s-good { background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); }
    .s-moderate { background:color-mix(in srgb,var(--warn) 16%,transparent); color:var(--warn); }
    .s-poor { background:color-mix(in srgb,var(--bad) 14%,transparent); color:var(--bad); }
    .tag { display:inline-block; font-size:12px; padding:1px 7px; border-radius:20px; border:1px solid var(--line); margin:2px 2px 0 0; }
    .tag.ok { border-color:var(--good); color:var(--good); } .tag.miss { border-color:var(--warn); color:var(--warn); }
    .flash { padding:10px 14px; border-radius:8px; background:color-mix(in srgb,var(--accent) 12%,transparent); margin-bottom:14px; }
    pre.desc { white-space:pre-wrap; font:inherit; margin:0; }
    .table-wrap { overflow-x:auto; }
  </style>
</head>
<body>
<header><div class="bar">
  <strong>🎯 AI Job Hunter</strong>
  {% if csrf and request.url.path != "/login" %}
    <a href="/">Jobs</a><a href="/applications">Applications</a><a href="/profile">Profile</a><a href="/sources">Sources</a>
    <form method="post" action="/logout" style="margin:0"><button class="secondary" type="submit">Log out</button></form>
  {% endif %}
</div></header>
<main>
  {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
