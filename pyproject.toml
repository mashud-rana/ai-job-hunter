[project]
name = "ai-job-hunter"
version = "0.1.0"
description = "AI-powered job hunting automation: collect, match, notify."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "feedparser>=6.0",
    "apscheduler>=3.10,<4",
    "python-telegram-bot>=21.0",
    "openai>=1.35",
    "pymupdf>=1.24",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF012", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
